# Configuración común de Buen Plato API: nombre, perfil predeterminado y servicios compartidos.
spring:
  application:
    name: buen-plato-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
