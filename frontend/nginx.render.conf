# Configuración de Nginx para Render.
# El frontend y la API son servicios separados, por lo que Nginx actúa como
# proxy same-origin: el navegador habla solo con el dominio del frontend y
# las cookies de sesión siguen siendo de primera parte.
#
# El despliegue manual actual usa buenplato.onrender.com como backend.
# Si cambia su dominio, actualiza proxy_pass y reconstruye el frontend.
server {
    listen 80;
    server_name _;
    # Permite fotos de 5 MB más los campos del formulario multipart.
    client_max_body_size 6m;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Sin URI al final: se conserva la ruta original /api/...
        proxy_pass https://buenplato.onrender.com;
        proxy_http_version 1.1;
        # Host debe ser el del backend, no el del frontend.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Render solo sirve HTTPS; no reenviar "http" desde la red interna.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # SNI necesario para el certificado TLS de Render.
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        # Margen para el arranque en frío del plan free (hasta ~1 minuto).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
